services:
  rooms:
    build: .
    # 用主機使用者的身分寫資料，資料夾裡的檔案才不會變成 root 的
    user: "${ROOMS_UID:-1000}:${ROOMS_GID:-1000}"
    # 本機設定（使用者是誰等）：repo 根目錄的 local.env，沒有也沒關係
    env_file:
      - path: local.env
        required: false
    # 判官：金鑰從啟動時的 shell 帶進來；ROOMS_JUDGE=off 可關掉
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ROOMS_JUDGE: ${ROOMS_JUDGE:-}
      ROOMS_JUDGE_URL: ${ROOMS_JUDGE_URL:-}
      ROOMS_JUDGE_MODEL: ${ROOMS_JUDGE_MODEL:-}
    volumes:
      - ${ROOMS_DATA_DIR:-./data}:/data
    ports:
      - "127.0.0.1:8775:8775"   # 本機入口：不驗證
      - "127.0.0.1:8776:8776"   # 遠端入口：一律要鑰匙（給 tailscale serve 之類轉進來的請求）
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8775/api/overview', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
