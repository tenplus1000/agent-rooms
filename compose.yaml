services:
  rooms:
    build: .
    # 用主機使用者的身分寫資料，資料夾裡的檔案才不會變成 root 的
    user: "${ROOMS_UID:-1000}:${ROOMS_GID:-1000}"
    volumes:
      - ${ROOMS_DATA_DIR:-./data}:/data
    ports:
      - "127.0.0.1:8775:8775"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8775/api/overview', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
