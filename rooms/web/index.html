<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>房間</title>
<style>
:root {
  --bg: #0e1116; --panel: #161b22; --panel2: #1c2230; --line: #2b3342; --text: #d7dde8; --dim: #8a94a6;
  --accent: #6cb6ff; --ok: #56d364; --idle: #a0aec0; --off: #4a5262; --warn: #f0b72f; --bad: #f47067; --dnd: #b083f0;
  --cube: rgba(108, 182, 255, 0.07); --cube-line: rgba(108, 182, 255, 0.45); --cube-sel: rgba(108, 182, 255, 0.95);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif; overflow: hidden; }
button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.danger:hover { border-color: var(--bad); color: var(--bad); }
#top { position: fixed; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center; gap: 10px;
  padding: 0 14px; background: rgba(14, 17, 22, 0.9); border-bottom: 1px solid var(--line); z-index: 20; }
#top .title { font-weight: 600; letter-spacing: 1px; }
#top .hint { color: var(--dim); font-size: 12px; margin-left: auto; cursor: help; border: 1px solid var(--line);
  border-radius: 50%; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; }
#outside { display: flex; align-items: center; gap: 8px; overflow-x: auto; min-width: 0; flex: 1; scrollbar-width: none; }
.gchip { border: 1px solid var(--warn); color: var(--text); background: rgba(240,183,47,0.07); border-radius: 14px;
  padding: 2px 12px; cursor: pointer; white-space: nowrap; font-weight: 600; position: relative; }
.gchip.on { background: rgba(240,183,47,0.28); }
.gchip small { color: var(--dim); font-weight: 400; margin-left: 4px; }
.gchip .n { position: absolute; right: -6px; top: -7px; background: var(--accent); color: #0b1220; border-radius: 9px;
  font-size: 10px; padding: 0 5px; font-weight: 700; }
.sep { width: 1px; height: 22px; background: var(--line); flex: none; }
.loose-label { color: var(--dim); font-size: 12px; white-space: nowrap; }
.lchip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border: 1px dashed var(--line); border-radius: 12px;
  cursor: grab; white-space: nowrap; font-size: 12px; user-select: none; touch-action: none; }
.lchip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.bubble.fixed { position: fixed; z-index: 21; }
#stage { position: fixed; top: 44px; left: 0; right: 0; bottom: 96px; overflow: hidden; touch-action: none; cursor: grab; }
#stage.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; width: 2600px; height: 1700px; transform-origin: 0 0; }
#world svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.room-label { fill: var(--text); font-size: 14px; font-weight: 600; cursor: grab; user-select: none; }
.room-sub { fill: var(--dim); font-size: 11px; user-select: none; }
.dot-label { fill: var(--dim); font-size: 11px; pointer-events: none; user-select: none; }
.dot { cursor: grab; }
.dot .glow { animation: breathe 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes breathe { 0%, 100% { opacity: .35; transform: scale(1); } 50% { opacity: .75; transform: scale(1.18); } }
.pile { cursor: pointer; }
.pile:hover .pile-n { fill: var(--text); }
.tray-label { fill: var(--dim); font-size: 12px; }
#bar { position: fixed; left: 0; right: 0; bottom: 0; height: 96px; background: var(--panel); border-top: 1px solid var(--line);
  display: flex; gap: 10px; padding: 12px 14px; align-items: stretch; z-index: 20; }
#target { min-width: 150px; max-width: 230px; display: flex; flex-direction: column; justify-content: center; gap: 2px;
  padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); }
#target .k { font-size: 11px; color: var(--dim); }
#target .v { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#input { flex: 1; resize: none; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 10px; font: inherit; }
#input:focus { outline: none; border-color: var(--accent); }
#send { min-width: 72px; }
.bubble { position: absolute; max-width: 240px; padding: 6px 26px 6px 10px; border-radius: 12px; background: var(--panel2);
  border: 1px solid var(--accent); font-size: 12px; cursor: pointer; z-index: 5; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
.bubble .who { color: var(--accent); font-weight: 600; }
.bubble .n { position: absolute; left: -8px; top: -8px; background: var(--accent); color: #0b1220; border-radius: 9px;
  font-size: 11px; padding: 0 6px; font-weight: 700; }
.bubble .x { position: absolute; right: 6px; top: 4px; color: var(--dim); }
.bubble .x:hover { color: var(--bad); }
.bubble .txt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.win { position: fixed; width: 460px; height: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  display: flex; flex-direction: column; z-index: 30; box-shadow: 0 12px 40px rgba(0,0,0,.55); }
.win header { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); cursor: move;
  user-select: none; }
.win header .t { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.win .log { flex: 1; overflow: auto; padding: 8px 12px; font-size: 13px; }
.msg { margin: 0 0 8px; white-space: pre-wrap; word-break: break-word; }
.msg .meta { color: var(--dim); font-size: 11px; }
.msg .meta b { color: var(--text); }
.msg.sys { color: var(--dim); font-size: 12px; }
.msg.mine .meta b { color: var(--accent); }
.wake { color: var(--dim); font-size: 11px; }
.layer { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: flex; align-items: center; justify-content: center; }
.dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; width: min(420px, 92vw); }
.dialog h3 { margin: 0 0 10px; font-size: 15px; }
.dialog p { color: var(--dim); margin: 0 0 12px; }
.dialog input, .dialog textarea { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
  border-radius: 6px; padding: 7px 9px; font: inherit; margin-bottom: 10px; }
.dialog .row { display: flex; gap: 8px; justify-content: flex-end; }
.pick { max-height: 180px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 10px; }
.pick div { padding: 6px 9px; cursor: pointer; }
.pick div:hover, .pick div.on { background: var(--panel2); color: var(--accent); }
.pop { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; z-index: 40;
  min-width: 220px; box-shadow: 0 8px 28px rgba(0,0,0,.5); }
.pop .name { font-weight: 600; }
.pop .sub { color: var(--dim); font-size: 12px; margin: 2px 0 8px; }
.pop .acts { display: flex; flex-wrap: wrap; gap: 6px; }
#roombar { position: fixed; z-index: 15; display: none; gap: 6px; }
#suggest { position: fixed; bottom: 92px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; z-index: 25;
  display: none; max-height: 220px; overflow: auto; min-width: 200px; }
#suggest div { padding: 5px 10px; cursor: pointer; }
#suggest div.on, #suggest div:hover { background: var(--panel2); color: var(--accent); }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 108px; background: var(--panel2); border: 1px solid var(--line);
  padding: 6px 12px; border-radius: 8px; z-index: 60; display: none; }
@media (max-width: 700px) {
  #top { gap: 6px; padding: 0 8px; }
  #fit { display: none; }
  #bar { gap: 6px; padding: 10px 8px; }
  #target { min-width: 0; max-width: 92px; padding: 0 6px; }
  #target .v { font-size: 12px; white-space: normal; }
  #send { min-width: 52px; }
  .win { left: 8px !important; right: 8px; width: auto; top: 54px !important; height: calc(100% - 170px); }
}
</style>
</head>
<body>
<div id="top">
  <span class="title">房間</span>
  <button id="newRoom">＋ 開房間</button>
  <button id="fit" title="把所有房間放進畫面">全部看得到</button>
  <div id="outside"></div>
  <span class="hint" title="滾輪縮放、拖空白處移動畫面&#10;點房間的頂面選它，拖房名搬房間&#10;拖點換房：拖到 ★ 當主持，拖離 ★ 卸任，拖到上面的狀態列就是離開房間&#10;點常駐／維修進入跟它講話的模式，再點一下離開&#10;Esc 關最上層">?</span>
</div>
<div id="stage"><div id="world"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg><div id="overlay"></div></div></div>
<div id="roombar"></div>
<div id="bar">
  <div id="target"><span class="k">送到</span><span class="v" id="targetName">—</span></div>
  <textarea id="input" placeholder="輸入訊息（@名字 可以找任何房間的人；Enter 送出，Shift+Enter 換行）"></textarea>
  <button id="send">送出</button>
</div>
<div id="suggest"></div>
<div id="toast"></div>

<script>
"use strict";
// ── 狀態 ─────────────────────────────────────────
const S = { ov: null, sel: null, mode: null, wins: {}, layers: [], desks: {}, drag: null, view: null };
const W = 150, D = 150, H = 100, COS = 0.866, SIN = 0.5;          // 立方體尺寸與等角投影
const store = {
  get(k, d) { try { const v = localStorage.getItem("rooms." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("rooms." + k, JSON.stringify(v)); } catch (e) {} },
};
const seenSeq = store.get("seen", {});        // 每間房看到第幾則
const hiddenSeq = store.get("hidden", {});    // 泡泡收起時的最後一則（有更新的才再冒出來）

// ── 視角：平移＋縮放 ─────────────────────────────
S.view = store.get("view", { x: 0, y: 0, k: 1 });
function applyView() {
  $("world").style.transform = `translate(${S.view.x}px,${S.view.y}px) scale(${S.view.k})`;
  store.set("view", S.view); placeRoombar();
}
function zoomAt(f, cx, cy) {
  const box = $("stage").getBoundingClientRect();
  const k = Math.min(2.5, Math.max(0.25, S.view.k * f));
  const wx = (cx - box.left - S.view.x) / S.view.k, wy = (cy - box.top - S.view.y) / S.view.k;   // 游標底下的那一點
  S.view = { x: cx - box.left - wx * k, y: cy - box.top - wy * k, k };
  applyView();
}
function fitAll() {
  const list = rooms();
  if (!list.length) { S.view = { x: 0, y: 0, k: 1 }; return applyView(); }
  const xs = [], ys = [];
  list.forEach((r, i) => { const [x, y] = roomPos(r, i); xs.push(x, x + (W + D) * COS); ys.push(y - 90, y + H + (W + D) * SIN + 40); });
  const box = $("stage").getBoundingClientRect();
  const w = Math.max(...xs) - Math.min(...xs) + 40, h = Math.max(...ys) - Math.min(...ys) + 40;
  const k = Math.min(1.4, Math.max(0.25, Math.min(box.width / w, box.height / h)));
  S.view = { x: -Math.min(...xs) * k + 20, y: -Math.min(...ys) * k + 10, k };
  applyView();
}
function setupView() {
  const stage = $("stage"), pts = {};
  let last = null;
  const ids = () => Object.keys(pts);
  const rebase = () => { const k = ids(); if (k.length >= 2) { const a = pts[k[0]], b = pts[k[1]];
    last = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, d: Math.hypot(a.x - b.x, a.y - b.y) }; } else if (k.length) last = { ...pts[k[0]] }; else last = null; };
  stage.addEventListener("pointerdown", e => {
    const bg = e.target === stage || e.target === $("svg") || e.target === $("world");
    if (!bg || (e.button !== 0 && e.button !== 1)) return;
    if (e.button === 1) e.preventDefault();
    pts[e.pointerId] = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY };
    rebase();
  });
  addEventListener("pointermove", e => {
    const p = pts[e.pointerId]; if (!p) return;
    p.x = e.clientX; p.y = e.clientY;
    if (!p.held) { if (Math.hypot(p.x - p.sx, p.y - p.sy) < 5) return; p.held = true; stage.classList.add("panning"); }  // 還算是點一下
    const k = ids();
    if (k.length >= 2) {
      const a = pts[k[0]], b = pts[k[1]];
      const m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, d = Math.hypot(a.x - b.x, a.y - b.y);
      if (last && last.d && d) zoomAt(d / last.d, m.x, m.y);
      if (last) { S.view.x += m.x - last.x; S.view.y += m.y - last.y; applyView(); }
      last = { x: m.x, y: m.y, d };
    } else if (last) {
      S.view.x += p.x - last.x; S.view.y += p.y - last.y; applyView();
      last = { x: p.x, y: p.y };
    }
  });
  const lift = e => { const p = pts[e.pointerId]; if (!p) return;
    const wasClick = !p.held; delete pts[e.pointerId]; rebase(); stage.classList.remove("panning");
    if (wasClick && !ids().length && (S.sel || S.mode)) { S.sel = null; render(); } };
  addEventListener("pointerup", lift); addEventListener("pointercancel", lift);
  stage.addEventListener("auxclick", e => { if (e.button === 1) e.preventDefault(); });
  stage.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.deltaY > 0 ? 0.89 : 1.12, e.clientX, e.clientY); }, { passive: false });
  applyView();
}

// ── 跟核心講話 ───────────────────────────────────
async function api(method, path, params = {}) {
  const key = store.get("key", "");
  const headers = { "Content-Type": "application/json" };
  if (key) headers.Authorization = "Bearer " + key;
  let url = path, body;
  const me = S.ov ? S.ov.user.id : null;
  const p = me ? Object.assign({ as: me }, params) : params;
  if (method === "GET") url += "?" + new URLSearchParams(p).toString();
  else body = JSON.stringify(p);
  const resp = await fetch(url, { method, headers, body });
  const data = await resp.json().catch(() => ({ ok: false, error: "核心沒有回 JSON" }));
  if (resp.status === 401) { await askKey(); return api(method, path, params); }
  if (!data.ok) throw new Error(data.error || "出錯了");
  return data.result;
}
function askKey() {
  return dialog({ title: "這個入口要鑰匙", text: "從網路連進來要帶鑰匙（room key 發的那一串）。", input: "鑰匙", ok: "記住" })
    .then(v => { if (v) store.set("key", v.trim()); });
}

// ── 小工具 ───────────────────────────────────────
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, ...kids) => {
  const svg = ["svg", "g", "path", "circle", "text", "rect", "polygon", "line", "ellipse", "title", "defs", "radialGradient",
    "stop", "filter", "feGaussianBlur"].includes(tag);
  const n = svg ? document.createElementNS("http://www.w3.org/2000/svg", tag) : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "on") for (const [ev, fn] of Object.entries(v)) n.addEventListener(ev, fn);
    else if (k === "text") n.textContent = v;
    else if (v !== null && v !== undefined && v !== false) n.setAttribute(k, v);
  }
  for (const kid of kids) if (kid) n.append(kid);
  return n;
};
const iso = (x, y, z) => [(x - y) * COS + D * COS, (x + y) * SIN - z + H];
const pts = list => list.map(p => iso(...p).join(",")).join(" ");
function toast(text) { const t = $("toast"); t.textContent = text; t.style.display = "block"; clearTimeout(t._h);
  t._h = setTimeout(() => t.style.display = "none", 2600); }
const agents = () => S.ov ? S.ov.agents : [];
const agentBy = sid => agents().find(a => a.session === sid);
const nameOf = sid => sid === S.ov.user.id ? S.ov.user.name : (agentBy(sid) || {}).name || sid.slice(0, 8);
const rooms = () => S.ov ? S.ov.rooms.filter(r => !r.desk) : [];
const globals = () => S.ov ? Object.entries(S.ov.globals || {}).map(([sid, g]) => ({ sid, ...g, name: nameOf(sid) })) : [];
const callOf = g => g.alias || g.name;
function stateOf(m) {
  const a = agentBy(m.session) || {};
  const d = (a.delivery || {}).action;
  if (m.off) return ["下線", "var(--off)"];
  if (m.dnd) return ["勿擾", "var(--dnd)"];
  if (["uncertain", "failed_after", "unavailable", "detached", "not_found", "desktop_closed"].includes(d)) return ["送不到", "var(--bad)"];
  if (m.online) return ["線上", "var(--ok)"];
  return ["閒著", "var(--idle)"];
}

// ── 畫面 ─────────────────────────────────────────
function roomPos(r, i) {
  if (r.pos) return r.pos;
  const cols = Math.max(1, Math.floor(($("stage").clientWidth - 40) / 340));
  return [40 + (i % cols) * 340, 110 + Math.floor(i / cols) * 400];
}
const ORB = {                       // 球的底色：Claude 偏暖、Codex 偏冷，別的 agent 中性
  claude: ["#ffd9b8", "#e08a4f", "#5a2f17"], codex: ["#cfe6ff", "#4f8fe0", "#14305a"], other: ["#e6e9ef", "#8d97a8", "#2c3240"],
};
const RING = { "線上": "#56d364", "閒著": null, "下線": null, "勿擾": "#b083f0", "送不到": "#f47067" };
function defs() {
  const d = el("defs");
  for (const [k, [hi, mid, lo]] of Object.entries(ORB)) {
    const g = el("radialGradient", { id: "orb-" + k, cx: "35%", cy: "30%", r: "75%" });
    g.append(el("stop", { offset: "0%", "stop-color": hi }), el("stop", { offset: "55%", "stop-color": mid }), el("stop", { offset: "100%", "stop-color": lo }));
    d.append(g);
  }
  const blur = el("filter", { id: "soft", x: "-60%", y: "-60%", width: "220%", height: "220%" });
  blur.append(el("feGaussianBlur", { stdDeviation: "3" }));
  d.append(blur);
  return d;
}
function render() {
  const svg = $("svg"); svg.replaceChildren(defs());
  const overlay = $("overlay"); overlay.replaceChildren();
  rooms().forEach((r, i) => drawRoom(svg, overlay, r, roomPos(r, i)));
  drawOutside();
  updateTarget(); placeRoombar();
  for (const id of Object.keys(S.wins)) if (!S.ov.rooms.find(r => r.room_id === id)) closeWin(id);
}
function drawRoom(svg, overlay, r, [px, py]) {
  const sel = S.sel === r.room_id;
  const g = el("g", { transform: `translate(${px},${py})`, "data-room": r.room_id });
  const line = sel ? "var(--cube-sel)" : "var(--cube-line)";
  // 後面的牆和地板（淡）
  g.append(el("polygon", { points: pts([[0,0,0],[W,0,0],[W,D,0],[0,D,0]]), fill: "rgba(108,182,255,0.05)", stroke: line, "stroke-width": 1 }));
  g.append(el("polygon", { points: pts([[0,0,0],[0,D,0],[0,D,H],[0,0,H]]), fill: "var(--cube)", stroke: line, "stroke-opacity": .35 }));
  g.append(el("polygon", { points: pts([[0,0,0],[W,0,0],[W,0,H],[0,0,H]]), fill: "var(--cube)", stroke: line, "stroke-opacity": .35 }));
  // 主持的位置（地板前方）
  const seat = [W * 0.78, D * 0.78];
  const [sx, sy] = iso(seat[0], seat[1], 0);
  const seated = r.members.some(m => m.session === r.owner);
  g.append(el("ellipse", { cx: sx, cy: sy, rx: 24, ry: 13, fill: seated ? "rgba(240,183,47,0.04)" : "rgba(240,183,47,0.08)",
    stroke: seated ? "none" : "var(--warn)", "stroke-dasharray": "3 3", "data-seat": r.room_id }));
  if (!seated) g.append(el("text", { x: sx, y: sy + 4, class: "room-sub", "text-anchor": "middle", fill: "var(--warn)", text: "★ 主持", "pointer-events": "none" }));
  // 前面兩面牆（透明）
  g.append(el("polygon", { points: pts([[0,D,0],[W,D,0],[W,D,H],[0,D,H]]), fill: "var(--cube)", stroke: line, "pointer-events": "none" }));
  g.append(el("polygon", { points: pts([[W,0,0],[W,D,0],[W,D,H],[W,0,H]]), fill: "var(--cube)", stroke: line, "pointer-events": "none" }));
  // 頂面：點它選房間
  const top = el("polygon", { points: pts([[0,0,H],[W,0,H],[W,D,H],[0,D,H]]), fill: sel ? "rgba(108,182,255,0.16)" : "rgba(108,182,255,0.06)",
    stroke: line, "stroke-width": sel ? 2 : 1, style: "cursor:pointer" });
  top.addEventListener("pointerdown", e => startRoomDrag(e, r, px, py));
  g.append(top);
  // 成員的點
  const others = r.members.filter(m => m.session !== r.owner && !m.off);
  const gone = r.members.filter(m => m.session !== r.owner && m.off);
  const cols = Math.max(1, Math.ceil(Math.sqrt(others.length)));
  others.forEach((m, k) => {
    const cx = W * 0.14 + (W * 0.56) * ((k % cols) + 0.5) / cols;

function startRoomDrag(e, r, px, py) {
  e.preventDefault();
  const sx = e.clientX, sy = e.clientY; let moved = false;
  const g = document.querySelector(`[data-room="${r.room_id}"]`);
  const k = S.view.k;
  const move = ev => { const dx = (ev.clientX - sx) / k, dy = (ev.clientY - sy) / k; if (Math.abs(dx) + Math.abs(dy) > 4 / k) moved = true;
    if (moved) g.setAttribute("transform", `translate(${px + dx},${py + dy})`); };
  const up = ev => {
    removeEventListener("pointermove", move); removeEventListener("pointerup", up);
    if (!moved) return selectRoom(r.room_id);
    const x = Math.max(0, px + (ev.clientX - sx) / k), y = Math.max(0, py + (ev.clientY - sy) / k);
    r.pos = [x, y]; render();
    api("POST", `/api/rooms/${r.room_id}/pos`, { x, y }).catch(err => toast(err.message));
  };
  addEventListener("pointermove", move); addEventListener("pointerup", up);
}
function startDotDrag(e, m, room) {

  const move = ev => {
    if (!ghost && Math.abs(ev.clientX - sx) + Math.abs(ev.clientY - sy) > 5) {
      ghost = el("div", { style: "position:fixed;z-index:70;pointer-events:none;padding:2px 8px;border-radius:10px;background:var(--accent);color:#0b1220;font-size:12px;font-weight:700", text: m.name });
      document.body.append(ghost);
    }
    if (ghost) { ghost.style.left = ev.clientX + 10 + "px"; ghost.style.top = ev.clientY + 10 + "px"; }
  };
  const up = async ev => {
    removeEventListener("pointermove", move); removeEventListener("pointerup", up);
    if (!ghost) return dotMenu(m, room, ev.clientX, ev.clientY);
    ghost.remove();
    const hit = document.elementsFromPoint(ev.clientX, ev.clientY);
    const seat = hit.find(n => n.getAttribute && n.getAttribute("data-seat"));
    const cube = hit.map(n => n.closest && n.closest("[data-room]")).find(Boolean);
    const target = seat ? seat.getAttribute("data-seat") : cube ? cube.getAttribute("data-room") : null;
    const from = room ? room.room_id : null;
    const wasOwner = room && room.owner === m.session;
    try {
      if (target !== from) await api("POST", "/api/move", { session: m.session, room_id: target || "" });
      if (seat) await api("POST", `/api/rooms/${target}/owner`, { session: m.session });
      else if (wasOwner) await api("POST", `/api/rooms/${from}/owner`, { session: S.ov.user.id });   // 拖離 ★：卸任
      toast(seat ? `${m.name} 當 ${target} 的主持` : wasOwner && target === from ? `${m.name} 卸下主持`
            : target ? `${m.name} 移到 ${target}` : `${m.name} 離開房間`);
    } catch (err) { toast(err.message); }
    refresh();
  };
  addEventListener("pointermove", move); addEventListener("pointerup", up);
}

    const hereName = (S.ov.rooms.find(r => r.room_id === here) || {}).name || here;
    // @ 不限房：@ 到別房的人，訊息記在對方的房
    const names = [...text.matchAll(/@([\w\-.㐀-鿿]+)/g)].map(x => x[1]);
    const foreign = new Set(), local = [];
    for (const n of names) {
      const a = agents().find(x => x.name === n);
      if (a && a.room_id && a.room_id !== here && !(S.ov.globals || {})[a.session]) foreign.add(a.room_id); else local.push(n);
    }
    const sent = [];
    if (!foreign.size || local.length) { await api("POST", `/api/rooms/${here}/post`, { text }); sent.push(hereName); }
    for (const rid of foreign) {
      await api("POST", `/api/rooms/${rid}/post`, { text: `〔從 ${hereName} 發〕${text}` });
      sent.push((S.ov.rooms.find(r => r.room_id === rid) || {}).name || rid);
    }
    $("input").value = ""; hideSuggest();
    toast("送到 " + sent.join("、"));
    if (t.kind === "desk") openWin(here);
    refresh();
  } catch (e) { toast(e.message); }
}
// @ 跳出名單
let sugg = [], suggOn = 0;
function onInput() {
  const v = $("input").value, pos = $("input").selectionStart;
  const m = v.slice(0, pos).match(/@([\w\-.㐀-鿿]*)$/);
  if (!m) return hideSuggest();
  const q = m[1];
  const names = [...new Set([...agents().filter(a => a.room_id).map(a => a.name), ...globals().map(callOf), S.ov.user.id])];
  sugg = names.filter(n => n.includes(q)).slice(0, 12);
  if (!sugg.length) return hideSuggest();
  suggOn = 0; showSuggest();
}
function showSuggest() {
  const box = $("suggest"); box.replaceChildren();
  sugg.forEach((n, i) => box.append(el("div", { class: i === suggOn ? "on" : "", text: "@" + n,
    on: { pointerdown: e => { e.preventDefault(); pickSuggest(n); } } })));
  box.style.left = $("input").getBoundingClientRect().left + "px"; box.style.display = "block";
}
function hideSuggest() { $("suggest").style.display = "none"; sugg = []; }
function pickSuggest(n) {
  const inp = $("input"), pos = inp.selectionStart, v = inp.value;
  const start = v.slice(0, pos).lastIndexOf("@");
  inp.value = v.slice(0, start) + "@" + n + " " + v.slice(pos);
  inp.selectionStart = inp.selectionEnd = start + n.length + 2; hideSuggest(); inp.focus();
}
function insertAt(n) { const inp = $("input"); inp.value = (inp.value ? inp.value.trimEnd() + " " : "") + "@" + n + " "; inp.focus(); }

// ── 自製的對話框（不用瀏覽器內建的）─────────────
function dialog({ title, text, input, value = "", ok = "好", cancel = "取消", danger, pick, pre }) {
  return new Promise(resolve => {
    let chosen = null;
    const box = el("div", { class: "dialog" }, el("h3", { text: title }));
    if (text) box.append(el("p", { text, style: pre ? "white-space:pre-wrap;max-height:50vh;overflow:auto;color:var(--text)" : null }));
    let field = null;
    if (input) { field = el("input", { placeholder: input }); field.value = value; box.append(field); }
    if (pick) {
      box.append(el("p", { text: pick.label, style: "margin:0 0 4px" }));
      const list = el("div", { class: "pick" });
      pick.items.forEach(it => { const row = el("div", { text: it.text }); row.addEventListener("click", () => {
        chosen = chosen === it.value ? null : it.value; [...list.children].forEach(c => c.classList.remove("on")); if (chosen) row.classList.add("on"); });
        list.append(row); });
      box.append(list);
    }
    const done = v => { layer.remove(); S.layers = S.layers.filter(l => l.id !== id); resolve(v); };
    const row = el("div", { class: "row" });
    if (cancel) row.append(el("button", { text: cancel, on: { click: () => done(input ? null : false) } }));
    row.append(el("button", { text: ok, class: danger ? "danger" : null, on: { click: () => done(pick ? { value: field ? field.value : "", pick: chosen } : input ? field.value : true) } }));
    box.append(row);
    const layer = el("div", { class: "layer" }, box);
    layer.addEventListener("pointerdown", e => { if (e.target === layer) done(input ? null : false); });
    document.body.append(layer);
    const id = pushLayer(() => done(input ? null : false));
    if (field) { field.focus(); field.addEventListener("keydown", e => { if (e.key === "Enter") row.lastChild.click(); }); }
  });
}
let layerSeq = 0;
function pushLayer(close) { const id = "l" + (++layerSeq); S.layers.push({ id, close }); return id; }
function closeTop() { const l = S.layers.pop(); if (l) l.close(); }

// ── 啟動與更新 ───────────────────────────────────
async function refresh() {
  try {
    const firstLoad = !S.ov;
    S.ov = await api("GET", "/api/overview");
    let first = false;
    for (const r of S.ov.rooms) {
      const last = lastEvent(r);
      if (!(r.room_id in seenSeq)) { seenSeq[r.room_id] = last ? last.seq : 0; first = true; }
    }
    if (first) store.set("seen", seenSeq);
    render();
    if (firstLoad && !store.get("viewSet", false)) { fitAll(); store.set("viewSet", true); }
    await Promise.all(Object.keys(S.wins).map(refreshWin));
  } catch (e) { toast("連不上核心：" + e.message); }
}

$("newRoom").addEventListener("click", newRoom);
$("send").addEventListener("click", send);
$("input").addEventListener("input", onInput);
$("input").addEventListener("keydown", e => {
  if (sugg.length && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); suggOn = (suggOn + (e.key === "ArrowDown" ? 1 : sugg.length - 1)) % sugg.length; showSuggest(); return; }
  if (sugg.length && (e.key === "Tab" || (e.key === "Enter" && !e.shiftKey))) { e.preventDefault(); pickSuggest(sugg[suggOn]); return; }
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
addEventListener("keydown", e => { if (e.key === "Escape") { if (sugg.length) hideSuggest(); else closeTop(); } });
$("fit").addEventListener("click", fitAll);
setupView();
refresh();
setInterval(refresh, 2500);
</script>
