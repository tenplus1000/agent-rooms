<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>房間</title>
<style>
:root {
  --bg: #0e1116; --panel: #161b22; --panel2: #1c2230; --line: #2b3342; --text: #d7dde8; --dim: #8a94a6;
  --accent: #6cb6ff; --ok: #56d364; --idle: #a0aec0; --off: #4a5262; --warn: #f0b72f; --bad: #f47067; --dnd: #b083f0;
  --cube: rgba(108, 182, 255, 0.07); --cube-line: rgba(108, 182, 255, 0.45); --cube-sel: rgba(108, 182, 255, 0.95);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, "Noto Sans TC", "Microsoft JhengHei", sans-serif; overflow: hidden; }
button { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.danger:hover { border-color: var(--bad); color: var(--bad); }
#top { position: fixed; top: 0; left: 0; right: 0; height: 44px; display: flex; align-items: center; gap: 10px;
  padding: 0 14px; background: rgba(14, 17, 22, 0.9); border-bottom: 1px solid var(--line); z-index: 20; }
#top .title { font-weight: 600; letter-spacing: 1px; }
#top .hint { color: var(--dim); font-size: 12px; margin-left: auto; cursor: help; border: 1px solid var(--line);
  border-radius: 50%; width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; }
#outside { display: flex; align-items: center; gap: 8px; overflow-x: auto; min-width: 0; flex: 1; scrollbar-width: none; }
.gchip { border: 1px solid var(--warn); color: var(--text); background: rgba(240,183,47,0.07); border-radius: 14px;
  padding: 2px 12px; cursor: pointer; white-space: nowrap; font-weight: 600; position: relative; }
.gchip.on { background: rgba(240,183,47,0.28); }
.gchip small { color: var(--dim); font-weight: 400; margin-left: 4px; }
.abadge { display: inline-block; margin-left: 5px; padding: 0 6px; border-radius: 9px; background: #e8833a; color: #0b1220;
  font-size: 11px; font-weight: 700; cursor: pointer; }
.dot .abadge-dot { cursor: pointer; }
.accp h4 { margin: 14px 0 6px; font-size: 13px; color: var(--dim); font-weight: 600; }
.accp .box { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 6px;
  white-space: pre-wrap; word-break: break-word; font-size: 13px; }
.accp .box .why { color: var(--dim); font-size: 12px; margin-top: 4px; }
.accp .box.ask { border-color: #e8833a; }
.accp .pick2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.accp .st { color: var(--dim); font-size: 12px; margin-right: 6px; }
.accp .scroll { max-height: 70vh; overflow: auto; padding-right: 4px; }
.accp details pre { white-space: pre-wrap; font-size: 12px; max-height: 40vh; overflow: auto; background: var(--bg);
  border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
.gchip .n { position: absolute; right: -6px; top: -7px; background: var(--accent); color: #0b1220; border-radius: 9px;
  font-size: 10px; padding: 0 5px; font-weight: 700; }
.sep { width: 1px; height: 22px; background: var(--line); flex: none; }
.loose-label { color: var(--dim); font-size: 12px; white-space: nowrap; }
.lchip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border: 1px dashed var(--line); border-radius: 12px;
  cursor: grab; white-space: nowrap; font-size: 12px; user-select: none; touch-action: none; }
.lchip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.bubble.fixed { position: fixed; z-index: 21; }
.tchip { border: 1px solid var(--line); color: var(--dim); border-radius: 14px; padding: 2px 12px; cursor: pointer; white-space: nowrap; }
.tchip:hover { color: var(--text); }
.tidy-pop { width: min(370px, calc(100vw - 16px)); }
.tidy-list { max-height: min(60vh, 520px); overflow: auto; }
.tidy-h { display: flex; align-items: center; gap: 6px; margin: 10px 0 4px; color: var(--dim); font-size: 12px; }
.tidy-h button { margin-left: auto; font-size: 11px; padding: 1px 8px; }
.tidy-h button + button { margin-left: 0; }
.tidy-row { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-top: 1px solid var(--line); }
.tidy-row .who { flex: 1; min-width: 0; cursor: grab; touch-action: none; }
.tidy-row .who b { display: block; font-weight: 600; }
.tidy-row .who small { display: block; color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tidy-row button { font-size: 11px; padding: 1px 8px; }
.tidy-row .who small.why { color: var(--warn); }
.tidy-judge { color: var(--text); }
#stage { position: fixed; top: 44px; left: 0; right: 0; bottom: 96px; overflow: hidden; touch-action: none; cursor: grab; }
#stage.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; width: 2600px; height: 1700px; transform-origin: 0 0; }
#world svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.room-label { fill: var(--text); font-size: 14px; font-weight: 600; cursor: grab; user-select: none; }
.room-sub { fill: var(--dim); font-size: 11px; user-select: none; }
.room-tool { font-size: 11px; cursor: pointer; user-select: none; }
.tool-ball { position: fixed; z-index: 17; width: 42px; text-align: center; cursor: grab; user-select: none; touch-action: none; }
.tool-ball .orb { width: 34px; height: 34px; margin: 0 auto; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-weight: 700; color: #0b1220; box-shadow: 0 3px 10px rgba(0,0,0,.45), inset -3px -4px 8px rgba(0,0,0,.25); position: relative; }
.tool-ball .orb i { position: absolute; right: -1px; top: -1px; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--bg); }
.tool-ball .nm { font-size: 10px; color: var(--dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tool-ball.on .orb { outline: 2px solid var(--accent); outline-offset: 2px; }
.tool-group { position: fixed; z-index: 16; font-size: 10px; color: var(--dim); width: 96px; text-align: right; white-space: nowrap; pointer-events: none; }
#toolpane { position: fixed; top: 44px; bottom: 96px; right: 70px; width: min(460px, 42vw); z-index: 18; display: none;
  flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); box-shadow: -10px 0 30px rgba(0,0,0,.45); }
#toolpane header { display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-bottom: 1px solid var(--line); }
#toolpane header .t { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#toolpane iframe { flex: 1; border: 0; width: 100%; background: #fff; }
#toolpane .body { flex: 1; overflow: auto; padding: 10px 12px; }
#toolpane pre { white-space: pre-wrap; font-size: 12px; margin: 0; }
.seg { display: flex; gap: 6px; margin-bottom: 10px; }
#attach { position: fixed; left: 190px; right: 100px; bottom: 98px; display: none; gap: 6px; flex-wrap: wrap; z-index: 21; }
#attach .chip { display: flex; align-items: center; gap: 6px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
  padding: 3px 6px; font-size: 12px; max-width: 260px; }
#attach .chip img { width: 38px; height: 38px; object-fit: cover; border-radius: 4px; }
#attach .chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#attach .chip b { cursor: pointer; color: var(--dim); }
#clip { min-width: 52px; }
#bar.drop { outline: 2px dashed var(--accent); outline-offset: -4px; }
.msg .att { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.msg .att img { max-width: 220px; max-height: 160px; border-radius: 6px; border: 1px solid var(--line); cursor: zoom-in; display: block; }
.msg .att a { color: var(--accent); font-size: 12px; }
.seg button.on { background: var(--accent); color: #0b1220; }
.dot-label { fill: var(--dim); font-size: 11px; pointer-events: none; user-select: none; }
.dot { cursor: grab; }
[data-room].snap polygon { stroke: var(--cube-sel); stroke-width: 2.5; stroke-opacity: 1; }
.dot .glow { animation: breathe 2.6s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
.pile { cursor: pointer; }
.pile:hover .pile-n { fill: var(--text); }
.tray-label { fill: var(--dim); font-size: 12px; }
#bar { position: fixed; left: 0; right: 0; bottom: 0; height: 96px; background: var(--panel); border-top: 1px solid var(--line);
  display: flex; gap: 10px; padding: 12px 14px; align-items: stretch; z-index: 20; }
#target { min-width: 150px; max-width: 230px; display: flex; flex-direction: column; justify-content: center; gap: 2px;
  padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel2); }
#target .k { font-size: 11px; color: var(--dim); }
#target .v { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#input { flex: 1; resize: none; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 10px; font: inherit; }
#input:focus { outline: none; border-color: var(--accent); }
#send { min-width: 72px; }
.bubble { position: absolute; max-width: 240px; padding: 6px 26px 6px 10px; border-radius: 12px; background: var(--panel2);
  border: 1px solid var(--accent); font-size: 12px; cursor: pointer; z-index: 5; box-shadow: 0 4px 14px rgba(0,0,0,.4); }
.bubble .who { color: var(--accent); font-weight: 600; }
.bubble .n { position: absolute; left: -8px; top: -8px; background: var(--accent); color: #0b1220; border-radius: 9px;
  font-size: 11px; padding: 0 6px; font-weight: 700; }
.bubble .x { position: absolute; right: 6px; top: 4px; color: var(--dim); }
.bubble .x:hover { color: var(--bad); }
.bubble .txt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.win { position: fixed; width: 460px; height: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
  display: flex; flex-direction: column; z-index: 30; box-shadow: 0 12px 40px rgba(0,0,0,.55); }
.win header { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); cursor: move;
  user-select: none; }
.win header .t { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.win .log { flex: 1; overflow: auto; padding: 8px 12px; font-size: 13px; }
.msg { margin: 0 0 8px; white-space: pre-wrap; word-break: break-word; }
.msg .meta { color: var(--dim); font-size: 11px; }
.msg .meta b { color: var(--text); }
.msg.sys { color: var(--dim); font-size: 12px; }
.msg.mine .meta b { color: var(--accent); }
.wake { color: var(--dim); font-size: 11px; }
.find { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-bottom: 1px solid var(--line); }
.find input { flex: 1; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
  padding: 4px 8px; font: inherit; }
.find .n { color: var(--dim); font-size: 12px; min-width: 44px; text-align: right; }
.msg mark { background: rgba(240,183,47,.35); color: inherit; border-radius: 2px; }
.msg.cur { outline: 1px solid var(--warn); outline-offset: 3px; border-radius: 4px; }
.msg.cur mark { background: var(--warn); color: #0b1220; }
.layer { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: flex; align-items: center; justify-content: center; }
.dialog { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; width: min(420px, 92vw); }
.dialog h3 { margin: 0 0 10px; font-size: 15px; }
.dialog p { color: var(--dim); margin: 0 0 12px; }
.dialog input, .dialog textarea { width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
  border-radius: 6px; padding: 7px 9px; font: inherit; margin-bottom: 10px; }
.dialog .row { display: flex; gap: 8px; justify-content: flex-end; }
.dialog.wide { width: min(720px, 94vw); }
.dialog p.board-near { background: var(--bg); border: 1px dashed var(--line); border-radius: 6px; padding: 8px 10px; font-size: 13px; }
.dialog p.board-near ~ textarea.board-edit { height: 34vh; }
.dialog textarea.board-edit { height: 55vh; resize: vertical; font: 13px/1.5 ui-monospace, monospace; white-space: pre-wrap; }
.pick { max-height: 180px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 10px; }
.pick div { padding: 6px 9px; cursor: pointer; }
.pick div:hover, .pick div.on { background: var(--panel2); color: var(--accent); }
.pop { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; z-index: 40;
  min-width: 220px; box-shadow: 0 8px 28px rgba(0,0,0,.5); }
.pop .name { font-weight: 600; }
.pop .sub { color: var(--dim); font-size: 12px; margin: 2px 0 8px; }
.pop .acts { display: flex; flex-wrap: wrap; gap: 6px; }
#roombar { position: fixed; z-index: 15; display: none; gap: 6px; align-items: center; }
#roombar .cnt { color: var(--dim); font-size: 12px; margin-right: 2px; }
#marquee { position: fixed; z-index: 14; border: 1px dashed var(--accent); background: rgba(108,182,255,0.08); pointer-events: none; display: none; }
#suggest { position: fixed; bottom: 92px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; z-index: 25;
  display: none; max-height: 320px; overflow: auto; min-width: 260px; }
#suggest div { padding: 5px 10px; cursor: pointer; }
#suggest div.on, #suggest div:hover { background: var(--panel2); color: var(--accent); }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 108px; background: var(--panel2); border: 1px solid var(--line);
  padding: 6px 12px; border-radius: 8px; z-index: 60; display: none; }
@media (max-width: 700px) {
  #top { gap: 6px; padding: 0 8px; }
  #fit { display: none; }
  #bar { gap: 6px; padding: 10px 8px; }
  #target { min-width: 0; max-width: 92px; padding: 0 6px; }
  #target .v { font-size: 12px; white-space: normal; }
  #send { min-width: 52px; }
  .win { left: 8px !important; right: 8px; width: auto; top: 54px !important; height: calc(100% - 170px); }
}
</style>
</head>
<body>
<div id="top">
  <span class="title">房間</span>
  <button id="newRoom">＋ 開房間</button>
  <button id="fit" title="把所有房間放進畫面">全部看得到</button>
  <div id="outside"></div>
  <span class="hint" title="滾輪縮放、拖空白處移動畫面&#10;點房間的頂面選它，拖房名搬房間&#10;Shift＋左鍵選多間，拖其中一間就整組一起搬&#10;拖點換房：拖到 ★ 換負責人，拖離 ★ 卸任，拖到上面的狀態列就是離開房間&#10;點常駐／維修進入跟它講話的模式，再點一下離開&#10;Esc 關最上層">?</span>
</div>
<div id="stage"><div id="world"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg><div id="overlay"></div></div></div>
<div id="roombar"></div>
<div id="marquee"></div>
<div id="tooldock"></div>
<div id="toolpane"></div>
<div id="bar">
  <div id="target"><span class="k">送到</span><span class="v" id="targetName">—</span></div>
  <button id="clip" title="附檔案（也可以直接貼上截圖、或把檔案拖進來）">附檔</button>
  <textarea id="input" placeholder="輸入訊息（@名字 可以找任何房間的人；Enter 送出，Shift+Enter 換行；截圖直接貼上）"></textarea>
  <button id="send">送出</button>
  <input type="file" id="filepick" multiple style="display:none">
</div>
<div id="suggest"></div>
<div id="attach"></div>
<div id="toast"></div>

<script>
"use strict";
// ── 狀態 ─────────────────────────────────────────
const S = { ov: null, sel: null, mode: null, wins: {}, layers: [], desks: {}, drag: null, view: null, local: null, badges: {} };
const W = 150, D = 150, H = 100, COS = 0.866, SIN = 0.5;          // 立方體尺寸與等角投影
// 接上別間的六個位置（跟核心的 NEIGHBOR_SIDES 一樣）：地板四個方向＋上下疊；拖到離其中一個這麼近就吸過去
const SIDES = [[W * COS, W * SIN], [-W * COS, -W * SIN], [-D * COS, D * SIN], [D * COS, -D * SIN], [0, -H], [0, H]];
const SNAP = 60;
const store = {
  get(k, d) { try { const v = localStorage.getItem("rooms." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("rooms." + k, JSON.stringify(v)); } catch (e) {} },
};
const seenSeq = store.get("seen", {});        // 每間房看到第幾則
const hiddenSeq = store.get("hidden", {});    // 泡泡收起時的最後一則（有更新的才再冒出來）

// ── 視角：平移＋縮放 ─────────────────────────────
S.view = store.get("view", { x: 0, y: 0, k: 1 });
function applyView() {
  $("world").style.transform = `translate(${S.view.x}px,${S.view.y}px) scale(${S.view.k})`;
  store.set("view", S.view); placeRoombar();
}
function zoomAt(f, cx, cy) {
  const box = $("stage").getBoundingClientRect();
  const k = Math.min(2.5, Math.max(0.25, S.view.k * f));
  const wx = (cx - box.left - S.view.x) / S.view.k, wy = (cy - box.top - S.view.y) / S.view.k;   // 游標底下的那一點
  S.view = { x: cx - box.left - wx * k, y: cy - box.top - wy * k, k };
  applyView();
}
function fitAll() {
  const list = rooms();
  if (!list.length) { S.view = { x: 0, y: 0, k: 1 }; return applyView(); }
  const xs = [], ys = [];
  list.forEach((r, i) => { const [x, y] = roomPos(r, i); xs.push(x, x + (W + D) * COS); ys.push(y - 90, y + H + (W + D) * SIN + 40); });
  const box = $("stage").getBoundingClientRect();
  const w = Math.max(...xs) - Math.min(...xs) + 40, h = Math.max(...ys) - Math.min(...ys) + 40;
  const k = Math.min(1.4, Math.max(0.25, Math.min(box.width / w, box.height / h)));
  S.view = { x: -Math.min(...xs) * k + 20, y: -Math.min(...ys) * k + 10, k };
  applyView();
}
function setupView() {
  const stage = $("stage"), pts = {};
  let last = null;
  const ids = () => Object.keys(pts);
  const rebase = () => { const k = ids(); if (k.length >= 2) { const a = pts[k[0]], b = pts[k[1]];
    last = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, d: Math.hypot(a.x - b.x, a.y - b.y) }; } else if (k.length) last = { ...pts[k[0]] }; else last = null; };
  stage.addEventListener("pointerdown", e => {
    const bg = e.target === stage || e.target === $("svg") || e.target === $("world");
    if (!bg || (e.button !== 0 && e.button !== 1)) return;
    if (e.button === 0 && (e.ctrlKey || e.metaKey)) return startMarquee(e);          // Ctrl＋拖：框選房間
    if (e.button === 1) e.preventDefault();
    pts[e.pointerId] = { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY };
    rebase();
  });
  addEventListener("pointermove", e => {
    const p = pts[e.pointerId]; if (!p) return;
    p.x = e.clientX; p.y = e.clientY;
    if (!p.held) { if (Math.hypot(p.x - p.sx, p.y - p.sy) < 5) return; p.held = true; stage.classList.add("panning"); }  // 還算是點一下
    const k = ids();
    if (k.length >= 2) {
      const a = pts[k[0]], b = pts[k[1]];
      const m = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, d = Math.hypot(a.x - b.x, a.y - b.y);
      if (last && last.d && d) zoomAt(d / last.d, m.x, m.y);
      if (last) { S.view.x += m.x - last.x; S.view.y += m.y - last.y; applyView(); }
      last = { x: m.x, y: m.y, d };
    } else if (last) {
      S.view.x += p.x - last.x; S.view.y += p.y - last.y; applyView();
      last = { x: p.x, y: p.y };
    }
  });
  const lift = e => { const p = pts[e.pointerId]; if (!p) return;
    const wasClick = !p.held; delete pts[e.pointerId]; rebase(); stage.classList.remove("panning");
    if (wasClick && !ids().length && (S.sel || S.mode || S.multi.size)) { S.sel = null; S.multi.clear(); render(); } };
  addEventListener("pointerup", lift); addEventListener("pointercancel", lift);
  stage.addEventListener("auxclick", e => { if (e.button === 1) e.preventDefault(); });
  stage.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.deltaY > 0 ? 0.89 : 1.12, e.clientX, e.clientY); }, { passive: false });
  applyView();
}

// ── 跟核心講話 ───────────────────────────────────
async function api(method, path, params = {}) {
  const key = store.get("key", "");
  const headers = { "Content-Type": "application/json" };
  if (key) headers.Authorization = "Bearer " + key;
  let url = path, body;
  const me = S.ov ? S.ov.user.id : null;
  const p = me ? Object.assign({ as: me }, params) : params;
  if (method === "GET") url += "?" + new URLSearchParams(p).toString();

async function refreshWin(roomId) {

function fileUrl(f) { return `/api/files/${f.rel.split("/").map(encodeURIComponent).join("/")}?as=${encodeURIComponent(S.ov.user.id)}`; }

// 搜尋對話（像 LINE）：打字就標出所有符合的訊息，從最新一則開始；Enter 往前一則、Shift+Enter 往後一則
function markMsg(m, q) {
  const body = m.querySelector(".body");
  if (body._raw === undefined) body._raw = body.textContent;
  const raw = body._raw, low = raw.toLowerCase(), name = (m.querySelector(".meta b") || {}).textContent || "";
  if (!q) { body.textContent = raw; return false; }
  const ql = q.toLowerCase();
  if (!low.includes(ql)) { body.textContent = raw; return name.toLowerCase().includes(ql); }   // 搜名字也算
  body.replaceChildren();
  let i = 0, k;
  while ((k = low.indexOf(ql, i)) >= 0) {
    body.append(document.createTextNode(raw.slice(i, k)), el("mark", { text: raw.slice(k, k + q.length) }));
    i = k + q.length;
  }
  body.append(document.createTextNode(raw.slice(i)));
  return true;
}
async function openFind(roomId) {
  const w = S.wins[roomId]; if (!w) return;
  if (w.find) { w.find.input.focus(); w.find.input.select(); return; }
  const input = el("input", { placeholder: "搜尋這間房的對話（名字或內容）" });
  const n = el("span", { class: "n" });
  const f = { q: "", hits: [], cur: -1, input };
  const go = d => {
    if (!f.hits.length) return;
    if (f.hits[f.cur]) f.hits[f.cur].classList.remove("cur");
    f.cur = (f.cur + d + f.hits.length) % f.hits.length;
    f.hits[f.cur].classList.add("cur");
    f.hits[f.cur].scrollIntoView({ block: "center" });
    f.count();
  };
  f.count = () => { n.textContent = f.q ? (f.hits.length ? `${f.cur + 1}/${f.hits.length}` : "0 則") : ""; };
  const run = async () => {
    f.q = input.value.trim();
    while (true) {                                     // 搜尋要整間房：還沒載完的先載完
      const before = w.last;
      await refreshWin(roomId);
      if (w.last === before) break;
    }
    if (f.q !== input.value.trim()) return;            // 載的時候又打了字，交給下一次
    w.log.querySelectorAll(".msg.cur").forEach(m => m.classList.remove("cur"));
    f.hits = [...w.log.children].filter(m => markMsg(m, f.q));
    f.cur = f.hits.length;
    if (f.hits.length) go(-1); else f.count();         // 從最新一則開始
  };
  let timer;
  input.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(run, 200); });
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); go(e.shiftKey ? 1 : -1); }
  });
  const bar = el("div", { class: "find" }, input, n,
    el("button", { text: "↑", title: "往前一則（Enter）", on: { click: () => go(-1) } }),
    el("button", { text: "↓", title: "往後一則（Shift+Enter）", on: { click: () => go(1) } }),
    el("button", { text: "✕", title: "關掉搜尋（Esc）", on: { click: () => f.close() } }));
  const id = pushLayer(() => f.close());
  f.close = () => {
    S.layers = S.layers.filter(l => l.id !== id);
    bar.remove(); delete w.find;
    w.log.querySelectorAll(".msg").forEach(m => { markMsg(m, ""); m.classList.remove("cur"); });
  };
  w.find = f;
  w.el.querySelector("header").after(bar);
  input.focus();
}

// 房裡的人全部下線：跳一個確認框問要不要把人移出、刪房（好幾間就一起問一次）；按「留著」的那一組人就不再問
async function offerCleanup(only) {
  if (S.asking || (!only && (document.querySelector(".dialog") || S.dragging))) return;
  const asked = store.get("cleanupAsked", {});
  const keyOf = r => r.members.map(m => m.session).sort().join(",");
  const list = (only ? [only] : S.ov.rooms).filter(r => !r.desk && r.members.length && r.members.every(m => m.off)
    && (only || asked[r.room_id] !== keyOf(r)));
  if (!list.length) return;
  S.asking = true;
  const one = list.length === 1 && list[0];
  const yes = await dialog({ title: one ? `${one.name} 裡的人都下線了` : `${list.length} 間房裡的人都下線了`,
    ok: one ? "移出並刪房" : "全部移出並刪房", cancel: "留著", danger: true, pre: !one,
    text: one ? `要把 ${one.members.map(m => m.name).join("、")} 移出房間，再刪掉 ${one.name}（${one.room_id}）嗎？紀錄封存在 data/rooms/deleted/。`
      : list.map(r => `${r.name}（${r.room_id}）：${r.members.map(m => m.name).join("、")}`).join("\n")
        + "\n\n要把這些人移出房間、刪掉這幾間嗎？紀錄封存在 data/rooms/deleted/。" });
  S.asking = false;
  if (yes) {
    for (const r of list) { if (S.sel === r.room_id) S.sel = null; S.multi.delete(r.room_id); }
    await act(Promise.all(list.map(r => api("POST", `/api/rooms/${r.room_id}/delete`, { evict: 1 }))),
      one ? `${one.name} 移出 ${one.members.length} 人、刪掉了` : `刪掉 ${list.length} 間房`);
  } else { for (const r of list) asked[r.room_id] = keyOf(r); store.set("cleanupAsked", asked); }
}
async function act(promise, ok) { try { await promise; toast(ok); } catch (e) { toast(e.message); } refresh(); }

// ── 拖拉：搬房間、換房、換負責人 ───────────────────
function startMarquee(e) {
  e.preventDefault();
  const box = $("marquee"), sx = e.clientX, sy = e.clientY;
  const before = new Set(S.multi.size ? S.multi : S.sel ? [S.sel] : []);
  let rect = null;
  const move = ev => {
    const x = Math.min(sx, ev.clientX), y = Math.min(sy, ev.clientY), w = Math.abs(ev.clientX - sx), h = Math.abs(ev.clientY - sy);
    rect = { x, y, w, h };
    Object.assign(box.style, { display: "block", left: x + "px", top: y + "px", width: w + "px", height: h + "px" });
  };
  const up = () => {
    removeEventListener("pointermove", move); removeEventListener("pointerup", up);
    box.style.display = "none";
    if (!rect || rect.w + rect.h < 8) return;
    // 房間的範圍跟框有交疊就算選到（Ctrl 框選是加進去，原本選的保留）
    for (const g of document.querySelectorAll("#svg [data-room]")) {
      const b = g.getBoundingClientRect();
      if (b.right > rect.x && b.left < rect.x + rect.w && b.bottom > rect.y && b.top < rect.y + rect.h) before.add(g.getAttribute("data-room"));
    }
    setMulti(before);
  };
  addEventListener("pointermove", move); addEventListener("pointerup", up);
}
function setMulti(ids) {
  S.multi = new Set(ids);
  S.sel = S.multi.size === 1 ? [...S.multi][0] : null;

  S.mode = null; render();

function cluster(id) {                       // 跟這間相連（共用白板）的整串房
  const seen = new Set([id]), todo = [id];
  while (todo.length) {
    const r = S.ov.rooms.find(x => x.room_id === todo.pop());
    for (const n of Object.keys((r && r.neighbors) || {})) if (!seen.has(n)) { seen.add(n); todo.push(n); }

      el("button", { text: "開窄窗", on: { click: () => { closeTop(); openToolPane(t); } } }),
      el("button", { text: "開成分頁", on: { click: () => { closeTop(); window.open(t.url, "_blank"); } } }),
      t.repo ? el("button", { text: "程式圖", on: { click: () => { closeTop(); openToolPane(t, "map"); } } }) : null,
      up === false && t.start && S.local ? el("button", { text: "啟動", on: { click: () => { closeTop(); startTool(t); } } }) : null,
      up && t.start && S.local ? el("button", { text: "重開", on: { click: () => { closeTop(); startTool(t, "restart"); } } }) : null,
      up && t.start && S.local ? el("button", { text: "停止", on: { click: () => { closeTop(); stopTool(t); } } }) : null,
      el("button", { text: "改", on: { click: () => { closeTop(); toolForm(t); } } }),
      el("button", { text: "刪", class: "danger", on: { click: async () => { closeTop();
        if (await dialog({ title: `刪掉 ${t.name}？`, text: "只是從房間拿掉登記，工具本身不受影響。", ok: "刪", danger: true }))
          act(api("POST", "/api/tools/delete", { id: t.id }), `${t.name} 拿掉了`); } } })),
    el("div", { class: "sub", text: "接到房間（再點一次拿掉）：", style: "margin-top:8px" }),
    el("div", { class: "acts" }, ...rooms_.map(r => {
      const on = (t.rooms || []).includes(r.room_id);
      return el("button", { text: (on ? "✓ " : "") + r.room_id, title: r.name, on: { click: () => { closeTop();
        act(api("POST", "/api/tools/link", { id: t.id, room_id: r.room_id, on: on ? 0 : 1 }), on ? `${t.name} 從 ${r.room_id} 拿掉` : `${t.name} 接到 ${r.room_id}`); } } });
    })));
  pop.querySelector(".sub").style.whiteSpace = "pre-wrap";
  const layer = el("div", { style: "position:fixed;inset:0;z-index:39" });
  layer.addEventListener("pointerdown", () => closeTop());
  document.body.append(layer, pop);
  pushLayer(() => { pop.remove(); layer.remove(); });
}
function roomToolMenu(t, r, x, y) {
  const pop = el("div", { class: "pop", style: `left:${Math.min(x, innerWidth - 260)}px;top:${Math.min(y, innerHeight - 160)}px` },
    el("div", { class: "name", text: t.name }),
    el("div", { class: "acts" },
      el("button", { text: "開窄窗", on: { click: () => { closeTop(); openToolPane(t); } } }),
      el("button", { text: `從 ${r.room_id} 拿掉`, on: { click: () => { closeTop();
        act(api("POST", "/api/tools/link", { id: t.id, room_id: r.room_id, on: 0 }), `${t.name} 從 ${r.room_id} 拿掉`); } } })));
  const layer = el("div", { style: "position:fixed;inset:0;z-index:39" });
  layer.addEventListener("pointerdown", () => closeTop());
  document.body.append(layer, pop);
  pushLayer(() => { pop.remove(); layer.remove(); });
}
async function stopTool(t) {
  try { await local("POST", "/local/tools/stop", { id: t.id }); toast(`${t.name} 停了`); }
  catch (e) { toast("停不了：" + e.message); }
  if (S.pane && S.pane.id === t.id) closeToolPane();
  refreshToolStatus();
}
async function startTool(t, how = "start") {
  try { await local("POST", `/local/tools/${how}`, { id: t.id }); toast(`${t.name} ${how === "restart" ? "重開" : "啟動"}中…`); }
  catch (e) { return toast("啟動不了：" + e.message); }
  for (let i = 0; i < 10; i++) {
    await new Promise(r => setTimeout(r, 800));
    await refreshToolStatus();
    if (S.toolUp[t.id]) { toast(`${t.name} 起來了`); if (S.pane && S.pane.id === t.id) openToolPane(t, S.pane.view); return; }
  }
  toast(`${t.name} 還沒起來，記錄檔在 ~/.local/state/agent-rooms/tools/${t.id}.log`);
}
function closeToolPane() {
  const pane = $("toolpane");
  pane.style.display = "none"; pane.replaceChildren();
  if (S.pane) S.layers = S.layers.filter(l => l.id !== S.pane.layer);
  S.pane = null; drawTools();
}
async function openToolPane(t, view = "page") {
  const pane = $("toolpane");
  if (S.pane) S.layers = S.layers.filter(l => l.id !== S.pane.layer);
  S.pane = { id: t.id, view, layer: pushLayer(() => closeToolPane()) };
  const head = el("header", {}, el("span", { class: "t", text: t.name }),
    t.repo ? el("button", { text: view === "map" ? "畫面" : "程式圖", on: { click: () => openToolPane(t, view === "map" ? "page" : "map") } }) : null,
    el("button", { text: "展開 ↗", title: "開成瀏覽器的分頁", on: { click: () => { window.open(t.url, "_blank"); closeToolPane(); } } }),
    el("button", { text: "✕", on: { click: () => closeToolPane() } }));
  pane.replaceChildren(head);
  pane.style.display = "flex";
  drawTools();
  if (view === "map") {
    const body = el("div", { class: "body" }, el("pre", { text: "產生程式圖中…" }));
    pane.append(body);
    try { const m = await local("GET", "/local/tools/map", { id: t.id }); body.firstChild.textContent = m.text; }
    catch (e) { body.firstChild.textContent = "讀不到程式圖（本機小幫手沒開？）：" + e.message; }
    return;
  }
  if (S.toolUp[t.id] === false) {
    pane.append(el("div", { class: "body" }, el("p", { text: `${t.name} 現在沒在跑。` }),
      t.start && S.local ? el("button", { text: "啟動", on: { click: () => startTool(t) } }) : el("p", { class: "sub", text: t.start ? "本機小幫手沒開，沒辦法從這裡啟動。" : "沒登記怎麼啟動。" })));
    return;
  }
  pane.append(el("iframe", { src: t.url, title: t.name }));
}
async function refreshToolStatus() {
  if (!S.local) return;
  try {
    const got = await local("GET", "/local/tools/status");
    if (JSON.stringify(got) !== JSON.stringify(S.toolUp)) { S.toolUp = got; drawTools(); }
  } catch (e) {}
}
function toolForm(t) {
  let kind = t ? t.category : "assistant";
  const f = {};
  const fields = [["name", "名字"], ["url", "網址（http://127.0.0.1:埠/）"], ["repo", "repo 資料夾（看程式圖、在這裡啟動）"],
                  ["start", "啟動指令（在 repo 裡跑，沒有就留空）"], ["note", "說明（給房裡的人看）"]];
  const box = el("div", { class: "dialog wide" }, el("h3", { text: t ? `改 ${t.name}` : "加一個本機工具" }));
  const seg = el("div", { class: "seg" });
  const fill = () => {
    [...seg.children].forEach(b => b.classList.toggle("on", b.dataset.kind === kind));
    if (!t) for (const k of ["url", "start", "note"]) if (!f[k].dataset.touched) f[k].value = TOOL_TEMPLATES[kind][k];
  };
  for (const [k, label] of Object.entries(toolKinds()))
    seg.append(el("button", { text: label, "data-kind": k, on: { click: () => { kind = k; fill(); } } }));
  box.append(el("p", { text: "分類（照分類先填好模板，要改再改）：", style: "margin:0 0 6px" }), seg);
  for (const [k, label] of fields) {
    f[k] = el("input", { placeholder: label });
    f[k].value = t ? (t[k] || "") : "";
    f[k].addEventListener("input", () => { f[k].dataset.touched = "1"; });
    box.append(f[k]);
  }
  fill();
  const done = () => { layer.remove(); S.layers = S.layers.filter(l => l.id !== id); };
  box.append(el("div", { class: "row" }, el("button", { text: "取消", on: { click: done } }),
    el("button", { text: t ? "存" : "加", on: { click: async () => {
      const body = { category: kind }; for (const [k] of fields) body[k] = f[k].value.trim();
      if (t) body.id = t.id;
      try { await api("POST", "/api/tools", body); done(); toast(t ? "改好了" : `${body.name} 加好了`); refresh(); refreshToolStatus(); }
      catch (e) { toast(e.message); }
    } } })));
  const layer = el("div", { class: "layer" }, box);
  layer.addEventListener("pointerdown", e => { if (e.target === layer) done(); });
  document.body.append(layer);
  const id = pushLayer(done);
  f.name.focus();
}

// ── 輸入框：送到哪 ───────────────────────────────
function targetInfo() {
  if (S.mode) { const g = globals().find(x => x.sid === S.mode); if (g) return { kind: "desk", sid: g.sid, label: `${callOf(g)}（${g.kind === "maintainer" ? "維修" : "常駐"}模式）` }; }
  if (S.sel) { const r = S.ov.rooms.find(x => x.room_id === S.sel); if (r) return { kind: "room", room: r.room_id, label: `${r.name}（${r.room_id}）` }; }
  const res = globals().find(g => g.kind === "resident") || globals()[0];
  if (res) return { kind: "desk", sid: res.sid, label: `${callOf(res)}（沒選房間）` };
  return { kind: "none", label: "先選一間房" };
}
function updateTarget() { $("targetName").textContent = targetInfo().label; }
async function deskRoom(sid) {
  if (!S.desks[sid]) S.desks[sid] = (await api("POST", "/api/desk", { session: sid })).room_id;
  return S.desks[sid];
}
// 附件：貼上截圖、📎 選檔、拖進輸入列；送出時先傳到那間房，再跟訊息一起送
S.attach = [];
function addFiles(list) {
  for (const f of list) {
    if (!f || !f.size) continue;
    const name = f.name && f.name !== "image.png" ? f.name : `截圖-${new Date().toTimeString().slice(0, 8).replace(/:/g, "")}.${(f.type.split("/")[1] || "png")}`;
    S.attach.push({ file: f, name, url: f.type.startsWith("image/") ? URL.createObjectURL(f) : null });
  }
  drawAttach();
}
function drawAttach() {
  const box = $("attach"); box.replaceChildren();
  box.style.display = S.attach.length ? "flex" : "none";
  S.attach.forEach((a, i) => box.append(el("div", { class: "chip" }, a.url ? el("img", { src: a.url }) : null, el("span", { text: a.name }),
    el("b", { text: "✕", title: "不附了", on: { click: () => { if (a.url) URL.revokeObjectURL(a.url); S.attach.splice(i, 1); drawAttach(); } } }))));
}
function b64(file) {
  return new Promise((ok, bad) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1] || ""); r.onerror = bad; r.readAsDataURL(file); });
}
async function uploadAll(roomId) {
  const out = [];
  for (const a of S.attach) out.push(await api("POST", `/api/rooms/${roomId}/upload`, { name: a.name, data: await b64(a.file) }));
  return out;
}
async function send() {
  const text = $("input").value.trim();
  if (!text && !S.attach.length) return;
  const t = targetInfo();
  if (t.kind === "none") return toast("先點一間房，或點常駐／維修");
  try {
    const here = t.kind === "desk" ? await deskRoom(t.sid) : t.room;
    if (!S.ov.rooms.find(r => r.room_id === here)) S.ov = await api("GET", "/api/overview");
    const hereName = (S.ov.rooms.find(r => r.room_id === here) || {}).name || here;
    // @ 不限房：@ 到別房的人，訊息記在對方的房
    const names = [...text.matchAll(/@([\w\-.㐀-鿿]+)/g)].map(x => x[1]);
    const foreign = new Set(), local = [];
    for (const n of names) {
      const a = agents().find(x => x.name === n);
      if (a && a.room_id && a.room_id !== here && !(S.ov.globals || {})[a.session]) foreign.add(a.room_id); else local.push(n);
    }
    const sent = [];
    if (!foreign.size || local.length || S.attach.length) {
      const files = S.attach.length ? await uploadAll(here) : undefined;
      await api("POST", `/api/rooms/${here}/post`, { text, files }); sent.push(hereName);
      S.attach.forEach(a => a.url && URL.revokeObjectURL(a.url)); S.attach = []; drawAttach();
    }
    for (const rid of foreign) {
      await api("POST", `/api/rooms/${rid}/post`, { text: `〔從 ${hereName} 發〕${text}` });
      sent.push((S.ov.rooms.find(r => r.room_id === rid) || {}).name || rid);
    }
    $("input").value = ""; hideSuggest();
    toast("送到 " + sent.join("、"));
    if (t.kind === "desk") openWin(here);
    refresh();
  } catch (e) { toast(e.message); }
}
// @ 跳出名單
let sugg = [], suggOn = 0;
function onInput() {
  const v = $("input").value, pos = $("input").selectionStart;
  const m = v.slice(0, pos).match(/@([\w\-.㐀-鿿]*)$/);
  if (!m) return hideSuggest();
  const q = m[1].toLowerCase();
  // 全部的人：@全部、全域角色、各房的人（在線的先、下線的後）、沒進房的；可以捲動
  const roomName = id => ((S.ov.rooms.find(r => r.room_id === id) || {}).name || id);
  const list = [{ name: "全部", hint: "這間房的每個人" }];
  for (const g of globals()) list.push({ name: callOf(g), hint: g.kind === "maintainer" ? "維修" : "常駐" });
  const inRoom = agents().filter(a => a.room_id && !(S.ov.globals || {})[a.session] && !(S.ov.rooms.find(r => r.room_id === a.room_id) || {}).desk);
  inRoom.sort((a, b) => (!!a.off - !!b.off) || roomName(a.room_id).localeCompare(roomName(b.room_id)) || a.name.localeCompare(b.name));
  for (const a of inRoom) list.push({ name: a.name, hint: roomName(a.room_id) + (a.off ? "・下線" : ""), dim: !!a.off });
  for (const a of agents().filter(a => !a.room_id && !a.shelved && !(S.ov.globals || {})[a.session]))
    list.push({ name: a.name, hint: "沒進房・拖進房間才收得到", dim: true });
  list.push({ name: S.ov.user.id, hint: S.ov.user.name });
  const seen = new Set();
  sugg = list.filter(x => x.name.toLowerCase().includes(q) && !seen.has(x.name) && seen.add(x.name));
  if (!sugg.length) return hideSuggest();
  suggOn = 0; showSuggest();
}
function showSuggest() {
  const box = $("suggest"); box.replaceChildren();
  sugg.forEach((x, i) => box.append(el("div", { class: i === suggOn ? "on" : "", style: x.dim ? "opacity:.6" : null,
    on: { pointerdown: e => { e.preventDefault(); pickSuggest(x.name); } } },
    document.createTextNode("@" + x.name), el("span", { text: "　" + x.hint, style: "color:var(--dim);font-size:11px" }))));
  box.style.left = $("input").getBoundingClientRect().left + "px"; box.style.display = "block";
  const on = box.children[suggOn]; if (on) on.scrollIntoView({ block: "nearest" });
}
function hideSuggest() { $("suggest").style.display = "none"; sugg = []; }
function pickSuggest(n) {
  const inp = $("input"), pos = inp.selectionStart, v = inp.value;
  const start = v.slice(0, pos).lastIndexOf("@");
  inp.value = v.slice(0, start) + "@" + n + " " + v.slice(pos);
  inp.selectionStart = inp.selectionEnd = start + n.length + 2; hideSuggest(); inp.focus();
}
function insertAt(n) { const inp = $("input"); inp.value = (inp.value ? inp.value.trimEnd() + " " : "") + "@" + n + " "; inp.focus(); }

// ── 自製的對話框（不用瀏覽器內建的）─────────────
function dialog({ title, text, input, area, value = "", ok = "好", cancel = "取消", danger, pick, pre }) {
  return new Promise(resolve => {
    let chosen = null;
    const box = el("div", { class: "dialog" }, el("h3", { text: title }));
    if (text) box.append(el("p", { text, class: area ? "board-near" : null,
      style: pre ? `white-space:pre-wrap;max-height:${area ? 28 : 50}vh;overflow:auto;color:var(--text)` : null }));
    let field = null;
    if (input) { field = el("input", { placeholder: input }); field.value = value; box.append(field); }
    if (area) { input = area; field = el("textarea", { placeholder: area, class: "board-edit" }); field.value = value; box.append(field); box.classList.add("wide"); }
    if (pick) {
      box.append(el("p", { text: typeof pick.label === "function" ? pick.label() : pick.label, style: "margin:0 0 4px" }));
      const list = el("div", { class: "pick" });
      pick.items.forEach(it => { const row = el("div", { text: it.text }); row.addEventListener("click", () => {
        chosen = chosen === it.value ? null : it.value; [...list.children].forEach(c => c.classList.remove("on")); if (chosen) row.classList.add("on"); });
        list.append(row); });
      box.append(list);
    }
    const done = v => { layer.remove(); S.layers = S.layers.filter(l => l.id !== id); resolve(v); };
    const row = el("div", { class: "row" });
    if (cancel) row.append(el("button", { text: cancel, on: { click: () => done(input ? null : false) } }));
    row.append(el("button", { text: ok, class: danger ? "danger" : null, on: { click: () => done(pick ? { value: field ? field.value : "", pick: chosen } : input ? field.value : true) } }));
    box.append(row);
    const layer = el("div", { class: "layer" }, box);
    layer.addEventListener("pointerdown", e => { if (e.target === layer) done(input ? null : false); });
    document.body.append(layer);
    const id = pushLayer(() => done(input ? null : false));
    if (field) { field.focus(); if (!area) field.addEventListener("keydown", e => { if (e.key === "Enter") row.lastChild.click(); }); }
  });
}
let layerSeq = 0;
function pushLayer(close) { const id = "l" + (++layerSeq); S.layers.push({ id, close }); return id; }
function closeTop() { const l = S.layers.pop(); if (l) l.close(); }

// ── 啟動與更新 ───────────────────────────────────
async function refresh() {
  try {
    const firstLoad = !S.ov;
    S.ov = await api("GET", "/api/overview");
    let first = false;
    for (const r of S.ov.rooms) {
      const last = lastEvent(r);
      if (!(r.room_id in seenSeq)) { seenSeq[r.room_id] = last ? last.seq : 0; first = true; }
    }
    if (first) store.set("seen", seenSeq);
    for (const id of [...S.multi]) if (!S.ov.rooms.find(r => r.room_id === id)) S.multi.delete(id);
    render();
    if (firstLoad && !store.get("viewSet", false)) { fitAll(); store.set("viewSet", true); }
    if (S.tidyFill) S.tidyFill();
    offerCleanup();
    await Promise.all(Object.keys(S.wins).map(refreshWin));
  } catch (e) { toast("連不上核心：" + e.message); }
}

$("newRoom").addEventListener("click", newRoom);
$("clip").addEventListener("click", () => $("filepick").click());
$("filepick").addEventListener("change", e => { addFiles([...e.target.files]); e.target.value = ""; });
// 貼上截圖：游標不在輸入框也收（例如剛點過房間或對話視窗）；別的輸入框（白板、搜尋）裡貼的不攔
document.addEventListener("paste", e => {
  const cd = e.clipboardData;
  if (!cd) return;
  const other = e.target.closest && e.target.closest("input, textarea, [contenteditable]");
  if (other && other.id !== "input") return;
  let files = [...(cd.items || [])].filter(i => i.kind === "file").map(i => i.getAsFile()).filter(Boolean);
  if (!files.length) files = [...(cd.files || [])];
  if (!files.length) return;
  e.preventDefault(); addFiles(files); $("input").focus();
  toast(`附上 ${files.length} 個檔案，打字後按送出`);
});
$("bar").addEventListener("dragover", e => { if ([...e.dataTransfer.types].includes("Files")) { e.preventDefault(); $("bar").classList.add("drop"); } });
$("bar").addEventListener("dragleave", () => $("bar").classList.remove("drop"));
$("bar").addEventListener("drop", e => { e.preventDefault(); $("bar").classList.remove("drop"); addFiles([...e.dataTransfer.files]); });
$("send").addEventListener("click", send);
$("input").addEventListener("input", onInput);
$("input").addEventListener("keydown", e => {
  if (sugg.length && (e.key === "ArrowDown" || e.key === "ArrowUp")) { e.preventDefault(); suggOn = (suggOn + (e.key === "ArrowDown" ? 1 : sugg.length - 1)) % sugg.length; showSuggest(); return; }
  if (sugg.length && (e.key === "Tab" || (e.key === "Enter" && !e.shiftKey))) { e.preventDefault(); pickSuggest(sugg[suggOn].name); return; }
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
addEventListener("keydown", e => { if (e.key === "Escape") { if (sugg.length) hideSuggest(); else closeTop(); } });
$("fit").addEventListener("click", fitAll);
setupView();
refresh();
setInterval(refresh, 2500);
refreshLocal().then(refreshToolStatus);
setInterval(() => refreshLocal().then(refreshToolStatus), 30000);
addEventListener("resize", () => drawTools());
</script>
